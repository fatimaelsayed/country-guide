<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Scotland!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
      :root {
        --granite: #2C2E29;
        --gorse: #C9A227;
        --thistle: #8B4789;
        --mist: #F3F0E8;
      }
 
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
      }
 
      #bg-video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
     .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(44, 46, 41, 0.45);
        z-index: 0;
        opacity: 0;
        animation: fadeIn 1s forwards;
        animation-delay: 12s;
      }
 
      .content {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        opacity: 0;
        animation: fadeIn 1s forwards;
        animation-delay: 12s;
      }
 
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
 
      .intro-box {
        max-width: 620px;
        text-align: left;
        color: var(--mist);
        padding: 20px;
        font-family: 'Public Sans', Arial, sans-serif;
      }
 
      .heading-row {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 18px;
      }
 
      .flag-icon {
        flex-shrink: 0;
        width: 56px;
        height: auto;
        border-radius: 2px;
        box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.4);
      }
 
      .intro-box h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 700;
        font-size: 4.5rem;
        line-height: 1.05;
        color: #fff8f8;
        margin: 0;
        text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.55);
      }
 
      .intro-box p {
        font-size: 1.15rem;
        line-height: 1.6;
        margin: 0 0 28px;
        color: var(--mist);
        border-left: 3px solid var(--thistle);
        padding-left: 16px;
      }
 
      .title-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--granite);
        background-color: var(--gorse);
        font-family: 'Public Sans', Arial, sans-serif;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 2px;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }
 
      .title-link .arrow {
        transition: transform 0.2s ease;
      }
 
      .title-link:hover {
        background-color: #e0bc3a;
        transform: translateY(-2px);
      }
 
      .title-link:hover .arrow {
        transform: translateX(4px);
      }
    </style>
</head>
<body>
    <div id="preloader">
      <div class="loader-spinner"></div>
    </div>
<video autoplay muted loop playsinline id="bg-video">
  <source src="IMG_5072.MOV" type="video/mp4">
</video>
<div class="overlay"></div>
<div class="content">
  <div class="intro-box">
    <div class="heading-row">
      <img src="Flag_of_Scotland.svg.webp" class="flag-icon" alt="Flag of Scotland">
      <h1>Welcome to Scotland</h1>
    </div>
    <p>Discover historic castles, breathtaking Highland views, and rich cultural traditions.</p>
    <a href="about.html" class="title-link">Explore Scotland <span class="arrow">&rarr;</span></a>
  </div>
</div>
 <script src="script.js"></script>
</body>
</html>
